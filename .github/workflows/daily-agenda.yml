name: Sakuragi Bot - Daily Agenda

on:
  schedule:
    # GitHub Actions の cron は UTC。22:05 UTC は JST 7:05。
    - cron: "5 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "取得対象日。未指定の場合は実行日の JST 当日。形式: YYYY-MM-DD"
        required: false
        type: string
      dry_run:
        description: "Discord へ投稿せず、生成本文をログで確認する"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: "true"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          cache: "npm"

      - run: npm --version
      - run: node scripts/check-lockfile.mjs
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run build

      - name: Run daily agenda
        shell: bash
        run: |
          args=()

          if [ -n "$INPUT_DATE" ]; then
            if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid date format. Expected YYYY-MM-DD."
              exit 1
            fi
            args+=(--date "$INPUT_DATE")
          fi

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi

          npm start -- "${args[@]}"
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AGENDA_NOTIFICATIONS_JSON: ${{ secrets.AGENDA_NOTIFICATIONS_JSON }}

      - name: Notify Discord on failure
        if: ${{ failure() }}
        run: |
          if [ -z "$FAILURE_DISCORD_WEBHOOK_URL" ]; then
            exit 0
          fi
          case "$FAILURE_DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*) ;;
            *) echo "FAILURE_DISCORD_WEBHOOK_URL is not a Discord webhook URL"; exit 1 ;;
          esac
          payload='{"content":"[Daily Agenda] 実行に失敗しました。GitHub Actionsログを確認してください。"}'
          curl --fail --show-error --silent -H "Content-Type: application/json" -X POST -d "$payload" "$FAILURE_DISCORD_WEBHOOK_URL"
        env:
          FAILURE_DISCORD_WEBHOOK_URL: ${{ secrets.FAILURE_DISCORD_WEBHOOK_URL }}
